name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh annotated release tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate semantic version tag
        run: |
          python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel
          sha256sum dist/* > dist/SHA256SUMS
      - name: Verify built consumers
        run: |
          python -m pip install --upgrade installer
          python -m venv .release-consumer
          .release-consumer/bin/python -m pip install dist/*.whl
          (cd /tmp && "$GITHUB_WORKSPACE/.release-consumer/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed.py")
      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REPOSITORY $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
