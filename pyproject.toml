[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp_doctor"
version = "0.2.0"
description = "MCP server contract linter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
mcp-doctor = "mcp_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
