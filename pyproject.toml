[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-doctor"
version = "0.1.0"
description = "A small, strict health check for Model Context Protocol stdio servers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jonah" }]
keywords = ["mcp", "model-context-protocol", "developer-tools", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
mcp-doctor = "mcp_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/jonah-ux/mcp-doctor"
Repository = "https://github.com/jonah-ux/mcp-doctor"
Issues = "https://github.com/jonah-ux/mcp-doctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
